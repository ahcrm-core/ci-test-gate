name: 'ci-test-gate'
description: 'LLM-powered test selection for CI — run only the tests that matter'
branding:
  icon: 'git-pull-request'
  color: 'green'

inputs:
  diff-file:
    description: 'Path to diff file'
    required: false
    default: ''
  test-files-list:
    description: 'Path to file listing all test files (one per line)'
    required: false
    default: ''
  mode:
    description: 'Operation mode: suggest or gate'
    required: false
    default: 'suggest'
  github-token:
    description: 'GitHub token for PR comments'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install ci-test-gate
      shell: bash
      run: |
        pip install ci-test-gate

    - name: Run ci-test-gate
      shell: bash
      run: |
        if [ -n "${{ inputs.diff-file }}" ]; then
          ci-test-gate suggest --diff "${{ inputs.diff-file }}" --mode ${{ inputs.mode }}
        else
          BASE="${{ github.base_ref || 'main' }}"
          git diff "origin/${BASE}...HEAD" > /tmp/pr_diff.txt
          ci-test-gate suggest --diff /tmp/pr_diff.txt --mode ${{ inputs.mode }}
        fi
